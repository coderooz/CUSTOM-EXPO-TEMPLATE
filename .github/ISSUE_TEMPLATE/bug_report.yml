name: Bug Report
description: Report a bug or unexpected behavior
title: "[Bug]: "
labels: ["bug", "triage"]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug report. Please fill out the
        template below so we can reproduce and fix the issue quickly.

  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      placeholder: A clear and concise description of what the bug is.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Create app with `npx create-expo-app`
        2. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      placeholder: A clear and concise description of what you expected to happen.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      placeholder: What actually happened.
    validations:
      required: true

  - type: input
    id: expo-sdk
    attributes:
      label: Expo SDK version
      placeholder: "e.g. 54.0.0"
    validations:
      required: true

  - type: input
    id: expo-router
    attributes:
      label: expo-router version (if applicable)
      placeholder: "e.g. 5.0.0"
    validations:
      required: false

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - iOS Simulator
        - Android Emulator
        - iOS Device
        - Android Device
        - Web
        - EAS Build
        - Other
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Host operating system
      options:
        - macOS
        - Windows
        - Linux
        - Other
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      placeholder: Paste any error messages, stack traces, or logs.
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      placeholder: Any other context, screenshots, or links.
    validations:
      required: false
