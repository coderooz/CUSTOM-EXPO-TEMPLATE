name: Feature Request
description: Suggest a new feature or enhancement
title: "[Feature]: "
labels: ["enhancement", "triage"]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a new feature! Please describe the problem
        you're trying to solve and the solution you'd like to see.

  - type: textarea
    id: problem
    attributes:
      label: Problem statement
      placeholder: Describe the problem this feature would solve.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      placeholder: A clear and concise description of what you want to happen.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      placeholder: What other approaches have you considered?
    validations:
      required: false

  - type: textarea
    id: use-cases
    attributes:
      label: Use cases
      placeholder: Who would benefit from this feature and how?
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      placeholder: Mockups, links, examples, or any other context.
    validations:
      required: false
