name: Welcome new contributors

on:
  issues:
    types: [opened]
  pull_request_target:
    types: [opened]

permissions:
  issues: write
  pull-requests: write

jobs:
  welcome:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/first-interaction@v1
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          issue-message: |
            👋 Welcome! Thanks for opening your first issue in this project.

            A maintainer will review it shortly. While you wait, please make sure
            you've filled out the issue template with as much detail as possible —
            that helps us help you faster.

            If you haven't already, please read the [contribution guide](CONTRIBUTING.md)
            and the [code of conduct](CODE_OF_CONDUCT.md).
          pr-message: |
            👋 Welcome! Thanks for opening your first pull request.

            A maintainer will review it shortly. Please make sure:

            - Tests pass locally
            - Lint and typecheck are clean
            - You've updated relevant documentation
            - Your commits follow the [Conventional Commits](https://www.conventionalcommits.org/) style

            See [CONTRIBUTING.md](CONTRIBUTING.md) for the full checklist.
